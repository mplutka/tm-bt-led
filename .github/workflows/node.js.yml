name: Node.js CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Also build the experimental Windows on ARM exe'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js 26.x
      uses: actions/setup-node@v7
      with:
        node-version: 26.x

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check optional iRacing SDK binding
      run: node -e "require('node-irsdk')"

    - name: Lint
      run: pnpm run lint

    - name: Unit tests
      run: pnpm test

    - name: Build native modules
      run: pnpm run build

    - name: Package executable
      run: pnpm run pack

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: tm-bt-led-${{ github.sha }}
        path: dist/*

  # Experimental, only on manual runs; native addons are compiled on the arm64 runner itself.
  build-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js 26.x
      uses: actions/setup-node@v7
      with:
        node-version: 26.x

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build native modules
      run: pnpm run build

    - name: Package executable
      run: pnpm run pack:arm64

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: tm-bt-led-arm64-${{ github.sha }}
        path: dist/*

  linux:
    name: linux (lint + tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - name: Use Node.js 26.x
      uses: actions/setup-node@v7
      with:
        node-version: 26.x

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check Bluetooth HCI binding
      run: node -e "require('@abandonware/bluetooth-hci-socket')"

    - name: Lint
      run: pnpm run lint

    - name: Unit tests
      run: pnpm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: tm-bt-led-${{ github.sha }}
        path: build

    - name: Create zip file
      run: |
        version="${GITHUB_REF_NAME#v}"
        mkdir release
        (cd build && zip -r "../release/tmbtled_${version}.zip" .)

    - name: Create release notes from CHANGELOG.md
      run: |
        version="${GITHUB_REF_NAME#v}"
        awk -v heading="## Version ${version}" '
          { sub(/[ \t\r]+$/, "") }
          $0 == heading { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md > changes.md
        if ! grep -q '[^[:space:]]' changes.md; then
          echo "::error::CHANGELOG.md has no section '## Version ${version}'"
          exit 1
        fi
        {
          echo "Download \`tmbtled_${version}.zip\`, extract it into an empty folder and follow the [usage steps](https://github.com/mplutka/tm-bt-led#usage). Linux runs from source, see [LINUX.md](https://github.com/mplutka/tm-bt-led/blob/main/LINUX.md)."
          cat changes.md
        } > release-notes.md

    - name: Publish GitHub release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        body_path: release-notes.md
        files: release/*.zip
